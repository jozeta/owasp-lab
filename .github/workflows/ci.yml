name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (ruff; settings in ruff.toml)
        run: pipx run ruff==0.17.3 check .
      - name: Exploit tests (in-memory SQLite, no Docker needed)
        run: pytest tests/ -q
